<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 28" width="36" height="28" aria-hidden="true" focusable="false">
  <title>Monarch butterfly with fluttering wings</title>

  <defs>
    <linearGradient id="monWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB03A"/>
      <stop offset="55%" stop-color="#F57E20"/>
      <stop offset="100%" stop-color="#E86A17"/>
    </linearGradient>
  </defs>

  <!-- Left Wing -->
  <g class="bf-wing bf-wing-left">
    <path d="M17 14 C12 6, 2 2, 2 10 C2 15, 9 17, 17 15" fill="url(#monWing)"/>
    <path d="M17 15 C10 16, 5 20, 7 24 C9 27, 14 24, 17 17" fill="url(#monWing)"/>
    <!-- monarch black cell borders -->
    <path d="M17 14 C12 6, 2 2, 2 10 C2 15, 9 17, 15 15 L9 16 Z" fill="none" stroke="#2A1506" stroke-width="0.8"/>
    <circle cx="9" cy="11" r="2.2" fill="#2A1506"/>
    <circle cx="6" cy="15" r="1.6" fill="#2A1506"/>
  </g>

  <!-- Right Wing -->
  <g class="bf-wing bf-wing-right">
    <path d="M19 14 C24 6, 34 2, 34 10 C34 15, 27 17, 19 15" fill="url(#monWing)"/>
    <path d="M19 15 C26 10, 30 22, 29 24 C27 27, 22 24, 19 17" fill="url(#monWing)"/>
    <path d="M19 14 C24 6, 34 2, 34 10 C34 15, 27 17, 21 15 Z" fill="none" stroke="#2A1506" stroke-width="0.8"/>
    <circle cx="27" cy="11" r="2.2" fill="#2A1506"/>
    <circle cx="30" cy="15" r="1.6" fill="#2A1506"/>
  </g>

  <!-- Body -->
  <ellipse cx="18" cy="15" rx="1.1" ry="4.2" fill="#24100A"/>
  <!-- Antennae -->
  <path d="M17.5 11 Q15 6 12 7" fill="none" stroke="#2A1506" stroke-width="0.6" stroke-linecap="round"/>
  <path d="M18.5 11 Q21 6 24 7" fill="none" stroke="#2A1506" stroke-width="0.6" stroke-linecap="round"/>
</svg>